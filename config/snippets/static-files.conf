# ================================================
# Snippet for serving static files (CSS, JS, images, fonts, etc.)
# Usage:
#   - Include this snippet in your server block for PHP or static sites
# ================================================

location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico|html)$ {
  # --------------------------------
  # Development environment (no caching)
  # --------------------------------
  # Comment out this block in production
    expires 0;
    add_header Cache-Control "no-cache, must-revalidate" always;
  # --------------------------------
  # Production environment (long cache + public)
  # --------------------------------
  # Uncomment this block for production
  # expires 30d;
  # add_header Cache-Control "public" always;

    access_log off;
}

# Notes:
# - In dev, files are always reloaded by browser
# - In prod, files are cached for 30 days; use versioned filenames if content changes
# - You can adjust the list of extensions according to your project needs
