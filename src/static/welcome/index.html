<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Gradient background animation */
        body {
            background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 800% 800%;
            animation: gradient 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main text */
        h1 {
            font-size: 4rem;
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Optional floating circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatCircle linear infinite;
        }

        .circle:nth-child(1) { width: 60px; height: 60px; background: #fff; top: 10%; left: 20%; animation-duration: 25s; }
        .circle:nth-child(2) { width: 80px; height: 80px; background: #fff; top: 70%; left: 10%; animation-duration: 30s; }
        .circle:nth-child(3) { width: 100px; height: 100px; background: #fff; top: 40%; left: 80%; animation-duration: 35s; }

        @keyframes floatCircle {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-200px) translateX(50px); }
            100% { transform: translateY(0) translateX(0); }
        }
    </style>
</head>
<body>
<h1>Welcome</h1>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
</body>
</html>
