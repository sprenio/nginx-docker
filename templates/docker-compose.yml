name: "nginx"

services:

  nginx:
    container_name: nginx
    image: nginx:1.28.0
    hostname: nginx
    networks:
      - reverse-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443" # Comment this out for internal calls when SSL encryption is enabled in the external layer
    restart: unless-stopped
    working_dir: /etc/nginx
    volumes:
      - ${NGINX_CONF_DIR:-./config}/error-sites:/etc/nginx/error-sites
      - ${NGINX_CONF_DIR:-./config}/sites:/etc/nginx/sites
      - ${NGINX_CONF_DIR:-./config}/nginx.conf:/etc/nginx/nginx.conf
      - ${NGINX_CONF_DIR:-./config}/default_server.conf:/etc/nginx/default_server.conf
      - ${NGINX_CONF_DIR:-./config}/snippets/error-pages.conf:/etc/nginx/snippets/error-pages.conf
      - ${NGINX_CONF_DIR:-./config}/snippets/http-def.conf:/etc/nginx/snippets/http-def.conf
      - ${NGINX_CONF_DIR:-./config}/snippets/https-def.conf:/etc/nginx/snippets/https-def.conf
      - ${NGINX_CONF_DIR:-./config}/snippets/static-files.conf:/etc/nginx/snippets/static-files.conf
      - ${WWW_DEFAULT_SRC_DIR:-./src/default}:/var/www/src/default
      - ${WWW_STATIC_SRC_DIR:-./src/static}:/var/www/src/static
      - ${WWW_PHP_FPM_SRC_DIR:-./src/php-fpm}:/var/www/src/php-fpm
      - ${NGINX_LOGS_DIR:-./logs}:/var/log/nginx
      - phpmyadmin-src-volume:/var/www/phpmyadmin:ro
      - ${SSL_FALLBACK_CERTS_DIR:-./ssl/fallback}:/etc/ssl/fallback:ro
      - app_share_volume:/var/www/share:ro
      # - phalcon_app_www-src-volume:/var/www/src/phalcon_app # uncomment if you want to mount phalcon app source code

      # Uncomment the following if you want to install SSL certificates via Certbot
      # - ${LETSENCRYPT_DIR:-./letsencrypt/etc}:/etc/letsencrypt:ro # certificates and keys (bind mount from host)

      # - ${CHALLENGE_DIR:-./letsencrypt/data}:/var/www/certbot:ro  # challenge directory (shared with certbot)
      # Uncomment the following if you want to install certificates via acme.sh
      # - ${SSL_CERTS_DIR:-./ssl/certs}:/etc/ssl/certs:ro

    # command: ["tail", "-f", "/dev/null"] # uncomment for debugging

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin:5.2-fpm
    restart: unless-stopped
    networks:
      - reverse-proxy
      - db-admin
    volumes:
      - phpmyadmin-src-volume:/var/www/html
      - ${PHPMYADMIN_CONF_DIR:-./config/phpmyadmin}/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    env_file: .env
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_COOKIE_SECURE: "true"     # Set to "true" when using HTTPS!
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_EMAIL_DOMAINS: ""   # do not allow all domains
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authorized_emails.txt  # only emails from this list are allowed
      OAUTH2_PROXY_UPSTREAMS: "file:///dev/null"   # nothing is proxied through oauth2-proxy, used solely for auth_request
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # The following must be set in .env:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
    networks:
      - reverse-proxy
    volumes:
      - ${OAUTH2_DIR:-./oauth2}/authorized_emails.txt:/etc/oauth2-proxy/authorized_emails.txt:ro
    restart: unless-stopped

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - dev

    #ports:
    #  - "1025:1025" # SMTP port
    #  - "8025:8025" # Web UI port

    networks:
      - reverse-proxy

volumes:
  phpmyadmin-src-volume:
  app_share_volume:
#  phalcon_app_www-src-volume: # uncomment if you want to mount phalcon app source code
#    external: true

networks:
  reverse-proxy:
    external: true
  db-admin:
    external: true