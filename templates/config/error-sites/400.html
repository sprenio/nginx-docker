<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        body { margin:0; height:100vh; display:flex; justify-content:center; align-items:center; font-family:'Montserrat', sans-serif; background: linear-gradient(135deg,#f7971e 0%,#ffd200 100%); color:#fff; }
        .container { text-align:center; animation: fadeIn 1s ease-in-out; }
        h1 { font-size:8rem; margin:0; animation: bounce 1s infinite; }
        p { font-size:1.5rem; margin:20px 0; }
        a { text-decoration:none; color:#fff; font-weight:bold; background: rgba(0,0,0,0.2); padding:10px 20px; border-radius:5px; transition: background 0.3s; }
        a:hover { background: rgba(0,0,0,0.4); }
        @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px);} }
        @keyframes fadeIn { from{opacity:0; transform:scale(0.9);} to{opacity:1; transform:scale(1);} }
    </style>
</head>
<body>
<div class="container">
    <h1>400</h1>
    <p>Bad Request – Your request cannot be processed.</p>
    <a href="//__HOME__/">Go Back Home</a>
</div>
</body>
</html>
