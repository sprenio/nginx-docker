# Default server configuration
server {
  error_page 404 /404.html;
  error_page 403 /403.html;
  location = /404.html {
    root /etc/nginx/error-sites;
    internal;
  }
  location = /403.html {
    root /etc/nginx/error-sites;
    internal;
  }
  #include  snippets/https-def.conf;
  server_name default;

  #include  snippets/snakeoil.conf;
  listen 80 default;
  listen [::]:80 default;

  root /var/www/src/default;


  location / {
    return 404;
  }

  access_log /var/log/nginx/access_default.log main;
  error_log /var/log/nginx/error_default.log;
}