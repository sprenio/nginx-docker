server {
    server_name default;

    include snippets/http-def.conf;

    root /var/www/src/default;

    include snippets/error-pages.conf;
    include snippets/static-files.conf;

    location / {
        return 404;
    }

    access_log /var/log/nginx/access_default.log main;
    error_log /var/log/nginx/error_default.log;
}
