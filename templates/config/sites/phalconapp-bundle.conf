# ================================================
# Nginx configuration template for reverse proxy
# Replace: {domain}, {subdomain}, {bundle_name}
# ================================================

# ------------------------------------------------
# 1️⃣ Redirect http to https
# ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.{subdomain}.{domain} {subdomain}.{domain} www.admin.{subdomain}.{domain} admin.{subdomain}.{domain};
    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_www.{subdomain}.{domain}.log;
    error_log /var/log/nginx/error_http_www.{subdomain}.{domain}.log;
 }

# ------------------------------------------------
# 2️⃣ Redirect non-www to www
# ------------------------------------------------
server {
    server_name {subdomain}.{domain} admin.{subdomain}.{domain};  # domain without "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    # SSL certificates (must exist)
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/www.{subdomain}.{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/www.{subdomain}.{domain}/privkey.pem;

    location / {
        # Redirect all requests to https://www
        return 301 https://www.$host$request_uri;
    }

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost
    # location / {
    #    # Redirect all requests to http://www
    #    return 301 http://www.$host$request_uri;
    # }
}

# ------------------------------------------------
# 3️⃣ Main server block for www (prod or dev)
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name www.{subdomain}.{domain};  # domain with "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/www.{subdomain}.{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/www.{subdomain}.{domain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost

    client_max_body_size 50M;
    include snippets/error-pages.conf;

    root /var/www/src/phalcon_app;
    index index.php index.html;

    # you can include some extra configuration file
    include /var/www/src/phalcon_app/var/nginx/server.conf;
    include /var/www/src/phalcon_app/application/bundles/{bundle_name}/var/nginx/server.conf;

    location ~* \.php$ {
      fastcgi_pass phalconapp-www:9000;
      include fastcgi_params;
      fastcgi_param PATH_INFO       $fastcgi_path_info;
      fastcgi_param DOCUMENT_ROOT   /var/www/src;  # <-- application root directory in the container
      fastcgi_param SCRIPT_FILENAME /var/www/src/$fastcgi_script_name; # <-- file path in the container

      fastcgi_param APPLICATION_BUNDLE {bundle_name};

      # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdnjs.cloudflare.com https://stackpath.bootstrapcdn.com; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com https://code.jquery.com https://cdnjs.cloudflare.com; font-src 'self' https://stackpath.bootstrapcdn.com; img-src 'self' data: https://code.jquery.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

      # you can overwrite some php-ini parameters
      #fastcgi_param PHP_ADMIN_VALUE "error_log=/var/www/logs/www.{subdomain}.{domain}-php-error.log;upload_max_filesize = 6M;";
      # you can set custom parameters
      #fastcgi_param APPLICATION_LOGS_DIR  /var/www/logs/{bundle_name};
      #fastcgi_param APPLICATION_CACHE_DIR /var/www/cache/{bundle_name};
      #fastcgi_param APPLICATION_DATA_DIR  /var/www/data/{bundle_name};

      # Timeouts
      proxy_read_timeout    900s; # max time to wait for response from backend after request is sent
      proxy_send_timeout    300s; # max time to send request body to backend
      send_timeout          300s; # max time to wait for the client (browser) to receive data from Nginx
                                  # - If the client stops reading (slow/broken connection), Nginx closes after this time.
                                  # - Does not affect communication with backend (only client ↔ Nginx).
      proxy_connect_timeout 2s;   # Time allowed to establish a TCP connection to the backend.
                                  # - For local Docker containers on the same host/network, 1–2s is enough.
                                  # - Increase this value (e.g. 10–30s) only if the backend is remote
                                  #   or connections may be delayed (cloud services, slow DNS, firewalls).

    }

    # Logs
    access_log /var/log/nginx/access_www.{subdomain}.{domain}.proxy.log;
    error_log  /var/log/nginx/error_www.{subdomain}.{domain}.proxy.log;
}
server {
    server_name www.admin.{subdomain}.{domain};  # domain with "www"

    # --------------------
    # Production (HTTPS)
