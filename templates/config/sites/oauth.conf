# ================================================
# Nginx configuration template for reverse proxy
# Replace: {domain}, {subdomain}, {docker_service}, {service_port}
# ================================================

# ------------------------------------------------
# Redirect http to https
# ------------------------------------------------
server {
    server_name {subdomain}.{domain}

    include snippets/http-def.conf;

    # Uncomment for Let's Encrypt ACME challenge
    # include snippets/acme-challenge.conf;

    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_{domain}.log;
    error_log /var/log/nginx/error_http_{domain}.log;
 }

# ------------------------------------------------
# 2️⃣ Main server block (prod or dev)
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name {subdomain}.{domain}; 

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/{subdomain}.{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/{subdomain}.{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/{subdomain}.{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/{subdomain}.{domain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost

# --- Auth request do oauth2-proxy
    location = /oauth2/ {
      proxy_pass       http://oauth2-proxy:4180;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Scheme          $scheme;
      proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # This location checks if the user is logged in:
    location = /oauth2/auth {
      proxy_pass       http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Scheme          $scheme;
      proxy_set_header Host              $host;
      # Without response body:
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # --- Backend
    location / {
      # 1) first ask oauth2-proxy if the user is logged in
      auth_request /oauth2/auth;

      # 2) if not – redirect to Google login
      error_page 401 = @oauth2_signin;

      # 3) (optionally) pass identity headers to the backend
      auth_request_set $user  $upstream_http_x_auth_request_user;
      auth_request_set $email $upstream_http_x_auth_request_email;
      proxy_set_header X-User  $user;
      proxy_set_header X-Email $email;

      proxy_pass http://{docker_service}:{service_port};

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Hard deny for unauthorized (if something goes wrong)
      add_header Cache-Control "no-store";
    }

    location @oauth2_signin {
      return 302 /oauth2/start?rd=$request_uri;
    }
    # Logs
    access_log /var/log/nginx/access_{subdomain}.{domain}.proxy.log;
    error_log  /var/log/nginx/error_{subdomain}.{domain}.proxy.log;
    # uncomment  for debug:
    # error_log /var/log/nginx/error_{subdomain}.{domain}.proxy.log debug;
}
