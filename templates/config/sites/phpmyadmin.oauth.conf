# ================================================
# Nginx configuration template for reverse proxy
# Replace: {domain}, {subdomain}
# ================================================

# ------------------------------------------------
# 1️⃣ Redirect http to https
# ------------------------------------------------
server {
    server_name {subdomain}.{domain};

    include snippets/http-def.conf;
    
    # Uncomment for Let's Encrypt ACME challenge
    # include snippets/acme-challenge.conf;

    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_{subdomain}.{domain}.log;
    error_log /var/log/nginx/error_http_{subdomain}.{domain}.log;
 }

# ------------------------------------------------
# 2️⃣ Main server block
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name {subdomain}.{domain}; 

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/{domain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost

    root /var/www/phpmyadmin;
    index index.php index.html;

    # --- Auth request do oauth2-proxy
    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Scheme          $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # This location checks if the user is logged in
    location = /oauth2/auth {
      proxy_pass       http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Scheme          $scheme;
      proxy_set_header Host              $host;
      # Without request body
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;      # not logged in → Google login
        try_files $uri $uri/ =404;
    }

    # --- Proper backend
    location ~ \.php$ {
      # 1) first ask oauth2-proxy if user is logged in
      auth_request /oauth2/auth;

      # 2) if not - redirect to Google login
      error_page 401 = @oauth2_signin;      # not logged in → Google login
      # 3) (optional) pass identity headers to backend
      auth_request_set $user  $upstream_http_x_auth_request_user;
      auth_request_set $email $upstream_http_x_auth_request_email;
      fastcgi_param X-User  $user;
      fastcgi_param X-Email $email;

      fastcgi_pass phpmyadmin:9000;
      include fastcgi_params;
      fastcgi_param PATH_INFO       $fastcgi_path_info;
      fastcgi_param DOCUMENT_ROOT   /var/www/html;  # <-- application root directory in the container
      fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Hard refusal for unauthorized (in case something goes wrong)
      add_header Cache-Control "no-store";
    }

    location @oauth2_signin {
      return 302 /oauth2/start?rd=$request_uri;
    }
    # Logs
    access_log /var/log/nginx/access_{subdomain}.{domain}.proxy.log;
    error_log  /var/log/nginx/error_{subdomain}.{domain}.proxy.log;
    # uncomment  for debug:
    # error_log /var/log/nginx/error_{subdomain}.{domain}.proxy.log debug;
}
