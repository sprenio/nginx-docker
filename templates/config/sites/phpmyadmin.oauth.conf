# ================================================
# Nginx configuration template for reverse proxy
# Replace: {domain}, {subdomain}
# ================================================

# ------------------------------------------------
# Redirect http to https
# ------------------------------------------------
server {
    server_name {subdomain}.{domain} www.{subdomain}.{domain};

    include snippets/http-def.conf;
    
    # Uncomment for Let's Encrypt ACME challenge
    # include snippets/acme-challenge.conf;

    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_www.{subdomain}.{domain}.log;
    error_log /var/log/nginx/error_http_www.{subdomain}.{domain}.log;
 }

# ------------------------------------------------
# 1️⃣ Redirect non-www to www
# ------------------------------------------------
server {
    server_name {subdomain}.{domain};  # domain without "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;

    # SSL certificates (must exist)
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/www.{subdomain}.{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/www.{subdomain}.{domain}/privkey.pem;

    location / {
        # Redirect all requests to https://www
        return 301 https://www.$host$request_uri;
    }

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost
    # location / {
    #    # Redirect all requests to http://www
    #    return 301 http://www.$host$request_uri;
    # }
}

# ------------------------------------------------
# 2️⃣ Main server block for www (prod or dev)
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name www.{subdomain}.{domain};  # domain with "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/www.{subdomain}.{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/www.{subdomain}.{domain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost

    root /var/www/phpmyadmin;
    index index.php index.html;

    # --- Auth request do oauth2-proxy
    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Scheme          $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Ta lokalizacja sprawdza, czy użytkownik jest zalogowany:
    location = /oauth2/auth {
      proxy_pass       http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Scheme          $scheme;
      proxy_set_header Host              $host;
      # Bez ciała odpowiedzi:
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;      # niezalogowany → login Google
        try_files $uri $uri/ =404;
    }

    # --- Właściwy backend
    location ~ \.php$ {
      # 1) najpierw zapytaj oauth2-proxy czy user jest zalogowany
      auth_request /oauth2/auth;

      # 2) jeśli NIE jest – przekieruj do logowania Google
      error_page 401 = @oauth2_signin;      # niezalogowany → login Google
      # 3) (opcjonalnie) przekaż nagłówki z tożsamością do backendu
      auth_request_set $user  $upstream_http_x_auth_request_user;
      auth_request_set $email $upstream_http_x_auth_request_email;
      fastcgi_param X-User  $user;
      fastcgi_param X-Email $email;

      fastcgi_pass phpmyadmin:9000;
      include fastcgi_params;
      fastcgi_param PATH_INFO       $fastcgi_path_info;
      fastcgi_param DOCUMENT_ROOT   /var/www/html;  # <-- application root directory in the container
      fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Twarda odmowa dla nieautoryzowanych (gdyby coś poszło bokiem)
      add_header Cache-Control "no-store";
    }

    location @oauth2_signin {
      return 302 /oauth2/start?rd=$request_uri;
    }
    # Logs
    access_log /var/log/nginx/access_www.{subdomain}.{domain}.proxy.log;
    error_log  /var/log/nginx/error_www.{subdomain}.{domain}.proxy.log;
    # uncomment  for debug:
    # error_log /var/log/nginx/error_www.{subdomain}.{domain}.proxy.log debug;
}
