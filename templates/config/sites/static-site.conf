# ================================================
# Nginx configuration template for static web page
# Replace: {domain}, {subdomain}
# ================================================

# ------------------------------------------------
# 1️⃣ Redirect http to https
# ------------------------------------------------
server {
    server_name {subdomain}.{domain};

    include snippets/http-def.conf;

    # Uncomment for Let's Encrypt ACME challenge
    # include snippets/acme-challenge.conf;

    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_{subdomain}.{domain}.log;
    error_log /var/log/nginx/error_http_{subdomain}.{domain}.log;
 }

# ------------------------------------------------
# 2️⃣ Main server block
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name {subdomain}.{domain};

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/{domain}.crt;
    ssl_certificate_key /etc/ssl/certs/{domain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /etc/letsencrypt/live/{domain}/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/{domain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost
    # server_name www.subdomain.localhost;   # Optional: override for dev

    client_max_body_size 50M;

    # Common error pages
    include snippets/error-pages.conf;
    include snippets/static-files.conf;

    # Root directory for static files
    root /var/www/src/static/welcome;

    # Main location
    location / {
        # Allow only standard HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        # Serve files, fallback to 404 if missing
        try_files $uri $uri/ =404;
    }

    # Logs
    access_log /var/log/nginx/access_{subdomain}.{domain}.static.log;
    error_log  /var/log/nginx/error_{subdomain}.{domain}.static.log;
}
