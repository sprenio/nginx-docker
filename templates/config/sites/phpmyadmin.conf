# ================================================
# Nginx configuration template for reverse proxy
# Replace: {domain}, {subdomain}
# ================================================

# ------------------------------------------------
# Redirect http to https
# ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name {subdomain}.{subdomain} www.{subdomain}.{subdomain};
    location / {
      # Redirect all requests to https://
      return 301 https://$host$request_uri;
    }
    access_log /var/log/nginx/access_http_www__{subdomain}.log;
    error_log /var/log/nginx/error_http_www_{subdomain}.log;
 }

# ------------------------------------------------
# 1️⃣ Redirect non-www to www
# ------------------------------------------------
server {
    server_name {subdomain}.{subdomain};  # domain without "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    # SSL certificates (must exist)
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{subdomain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{subdomain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /var/www/ssl_certificates/www.{subdomain}.{subdomain}/fullchain.pem;
    #ssl_certificate_key /var/www/ssl_certificates/www.{subdomain}.{subdomain}/privkey.pem;

    location / {
        # Redirect all requests to https://www
        return 301 https://www.$host$request_uri;
    }

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost
    # location / {
    #    # Redirect all requests to http://www
    #    return 301 http://www.$host$request_uri;
    # }
}

# ------------------------------------------------
# 2️⃣ Main server block for www (prod or dev)
# - Prod: include snippets/https-def.conf and SSL certificates
# - Dev: include snippets/http-def.conf and comment out SSL lines
# ------------------------------------------------
server {
    server_name www.{subdomain}.{subdomain};  # domain with "www"

    # --------------------
    # Production (HTTPS)
    # --------------------
    include snippets/https-def.conf;          # Comment out for dev
    ssl_certificate     /etc/ssl/certs/www.{subdomain}.{subdomain}.crt;
    ssl_certificate_key /etc/ssl/certs/www.{subdomain}.{subdomain}.key;
    # If you use certbot for creating certificate, uncomment these lines and comment out the above two lines
    #ssl_certificate     /var/www/ssl_certificates/www.{subdomain}.{subdomain}/fullchain.pem;
    #ssl_certificate_key /var/www/ssl_certificates/www.{subdomain}.{subdomain}/privkey.pem;

    # --------------------
    # Development (HTTP)
    # --------------------
    # include snippets/http-def.conf;         # Uncomment for dev/localhost

    client_max_body_size 50M;
    include snippets/error-pages.conf;

    root /var/www/phpmyadmin;
    index index.php index.html;

    # you can include some extra configuration file
    #include /var/www/phpmyadmin/var/nginx/server.conf;

    location ~* \.php$ {
      fastcgi_pass phpmyadmin:9000;
      include fastcgi_params;
      fastcgi_param PATH_INFO       $fastcgi_path_info;
      fastcgi_param DOCUMENT_ROOT   /var/www/html;  # <-- application root directory in the container
      fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;

      # you can overwrite some php-ini parameters
      #fastcgi_param PHP_ADMIN_VALUE "error_log=/var/www/logs/{YOUR_DOMAIN}-php-error.log;upload_max_filesize = 6M;";
      # you can set custom parameters
      #fastcgi_param APPLICATION_LOGS_DIR  /var/www/logs/phpmyadmin;
      #fastcgi_param APPLICATION_CACHE_DIR /var/www/cache/phpmyadmin;
      #fastcgi_param APPLICATION_DATA_DIR  /var/www/data/phpmyadmin;
    }

    # Logs
    access_log /var/log/nginx/access_www.{subdomain}.{subdomain}.proxy.log;
    error_log  /var/log/nginx/error_www.{subdomain}.{subdomain}.proxy.log;
}
